<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virgil — Performance Dashboard</title>
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #4f46e5;
    --good: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --card: #1a1a1a;
      --text: #f5f5f4;
      --muted: #a1a1aa;
      --border: #27272a;
      --accent: #818cf8;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 2rem 1rem;
    max-width: 1024px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 2rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  h1 { font-size: 1.75rem; font-weight: 600; }
  h1 .tagline {
    display: block;
    font-size: 0.875rem;
    font-weight: 400;
    color: var(--muted);
    margin-top: 0.125rem;
  }
  .meta { font-size: 0.875rem; color: var(--muted); }
  .meta b { color: var(--text); font-weight: 500; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
  }
  h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  h2 .badge {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .primary-kpi {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2rem;
    align-items: center;
  }
  .v-value {
    font-size: 3.5rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
  }
  .v-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  .v-trend {
    font-size: 0.875rem;
    color: var(--muted);
    margin-top: 0.5rem;
  }
  .v-note {
    font-size: 0.875rem;
    color: var(--text);
    margin-top: 0.75rem;
    padding: 0.5rem 0.75rem;
    background: var(--bg);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
  }
  .sparkline { width: 100%; height: 60px; }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 0.75rem;
  }
  .kpi {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.875rem;
    background: var(--bg);
  }
  .kpi-name {
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  .kpi-value {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--accent);
  }
  .kpi-target {
    font-size: 0.75rem;
    color: var(--muted);
  }
  .kpi-note {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.5rem;
    font-style: italic;
  }
  .kpi.warn .kpi-value { color: var(--warn); }
  .kpi.bad .kpi-value { color: var(--bad); }
  .kpi.good .kpi-value { color: var(--good); }
  .session-row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
    font-size: 0.875rem;
  }
  .session-row:last-child { border-bottom: none; }
  .session-date { color: var(--muted); font-variant-numeric: tabular-nums; }
  .session-meta { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .placeholder {
    padding: 1.5rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.875rem;
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .placeholder b { color: var(--text); font-weight: 500; }
  .workflow-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 0.625rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 0.875rem;
    align-items: start;
  }
  .workflow-card:last-child { margin-bottom: 0; }
  .workflow-card.inactive { opacity: 0.7; background: var(--bg); }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .dot.active { background: var(--good); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
  .dot.designed { background: var(--warn); }
  .dot.inactive { background: var(--muted); opacity: 0.4; }
  .workflow-name {
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .workflow-tagline {
    color: var(--muted);
    font-size: 0.875rem;
    margin-top: 0.25rem;
  }
  .workflow-meta {
    text-align: right;
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .workflow-meta .metric-value {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--accent);
    display: block;
  }
  .category-tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 500;
  }
  .category-tag.built-in { background: rgba(79,70,229,0.08); border-color: var(--accent); color: var(--accent); }
  .empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }
  .empty-state h2 { justify-content: center; margin-bottom: 0.5rem; color: var(--text); }
  .empty-state code {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    display: inline-block;
    margin-top: 1rem;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", monospace;
    font-size: 0.875rem;
  }
  footer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div class="empty-state">
    <h2>Loading…</h2>
    <p>If you see this for more than a moment, run <code>/wrap-up</code> in Virgil to populate the dashboard.</p>
    <p style="margin-top: 1rem;">First time? See <a href="../docs/SETUP.md">SETUP.md</a>.</p>
  </div>
</div>

<!-- Load order: example first (always exists, marks itself), then real (overrides if exists) -->
<script src="dashboard-data.example.js"></script>
<script src="dashboard-data.js"></script>
<script>
// By now both load attempts have completed (synchronous parsing).
// If dashboard-data.js exists, it overrode the example. If not, the example data remains.
// The is_example flag distinguishes them — example sets true, real sets false.

function fmtCycle(c) { return c || '—'; }
function fmtDate(d) {
  if (!d) return '—';
  var dt = new Date(d);
  return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function timeAgo(d) {
  if (!d) return '';
  var now = new Date(), then = new Date(d);
  var s = Math.floor((now - then) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sparkline(history) {
  if (!history || history.length < 2) return '<svg class="sparkline"></svg>';
  var vals = history.map(function(h){ return h.value; });
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  var range = max - min || 1;
  var w = 100, h = 40;
  var pts = vals.map(function(v, i){
    var x = (i / (vals.length - 1)) * w;
    var y = h - ((v - min) / range) * h;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  var last = vals[vals.length-1];
  var lastX = w, lastY = h - ((last - min) / range) * h;
  return '<svg class="sparkline" viewBox="0 0 100 40" preserveAspectRatio="none">' +
    '<polyline fill="none" stroke="var(--accent)" stroke-width="2" points="' + pts + '" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + lastX + '" cy="' + lastY.toFixed(1) + '" r="3" fill="var(--accent)" vector-effect="non-scaling-stroke"/>' +
    '</svg>';
}

function trendArrow(trend) {
  if (trend === 'up') return '↑';
  if (trend === 'down') return '↓';
  if (trend === 'flat') return '→';
  return '·';
}

function kpiSeverity(kpi) {
  // Heuristic severity coloring based on whether 'current' meets 'target'
  if (!kpi.severity) return '';
  return kpi.severity; // 'good' | 'warn' | 'bad'
}

function render() {
  var data = window.__VIRGIL_DASHBOARD__;
  if (!data || !data.agents || !data.agents.length) {
    document.getElementById('app').innerHTML = '<div class="empty-state"><h2>No dashboard data yet</h2><p>Run <code>/wrap-up</code> in Virgil to populate this dashboard.</p></div>';
    return;
  }

  var html = '';
  if (data.is_example) {
    html += '<div style="background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 0.625rem 0.875rem; margin-bottom: 1rem; font-size: 0.85rem; color: #92400e;"><b>⚠️ EXAMPLE DATA — not your real Virgil metrics.</b> Run <code style="background: rgba(0,0,0,0.05); padding: 1px 6px; border-radius: 4px;">/wrap-up</code> in Virgil to generate your own <code>dashboard-data.js</code>.</div>';
  }

  data.agents.forEach(function(agent) {
    html += '<header>';
    html += '<div><h1>' + escapeHtml(agent.name || 'Virgil') + '<span class="tagline">Performance dashboard</span></h1></div>';
    html += '<div class="meta">Cycle <b>' + escapeHtml(fmtCycle(agent.cycle)) + '</b> · Updated <b>' + escapeHtml(timeAgo(agent.last_updated)) + '</b></div>';
    html += '</header>';

    // Primary KPI
    if (agent.primary_kpi) {
      var k = agent.primary_kpi;
      html += '<section><h2>Primary KPI ' + (k.is_baseline ? '<span class="badge">baseline</span>' : '') + '</h2>';
      html += '<div class="primary-kpi">';
      html += '<div><div class="v-label">' + escapeHtml(k.name || 'V') + '</div>';
      html += '<div class="v-value">' + escapeHtml(String(k.current_value != null ? k.current_value : '—')) + '</div>';
      html += '<div class="v-trend">' + trendArrow(k.trend) + ' ' + escapeHtml(k.trend_label || '') + '</div></div>';
      html += '<div>' + sparkline(k.history) + '</div></div>';
      if (k.note) html += '<div class="v-note">' + escapeHtml(k.note) + '</div>';
      html += '</section>';
    }

    // Diagnostic KPIs (objective)
    if (agent.diagnostic_objective && agent.diagnostic_objective.length) {
      html += '<section><h2>Diagnostic KPIs <span class="badge">objective</span></h2>';
      html += '<div class="kpi-grid">';
      agent.diagnostic_objective.forEach(function(kpi) {
        var sev = kpiSeverity(kpi);
        html += '<div class="kpi ' + sev + '">';
        html += '<div class="kpi-name">' + escapeHtml(kpi.name) + '</div>';
        html += '<div class="kpi-value">' + escapeHtml(kpi.current || '—') + '</div>';
        html += '<div class="kpi-target">target: ' + escapeHtml(kpi.target || '—') + '</div>';
        if (kpi.note) html += '<div class="kpi-note">' + escapeHtml(kpi.note) + '</div>';
        html += '</div>';
      });
      html += '</div></section>';
    }

    // Diagnostic KPIs (judgment-based)
    if (agent.diagnostic_judgment && agent.diagnostic_judgment.length) {
      html += '<section><h2>Diagnostic KPIs <span class="badge">judgment</span></h2>';
      html += '<div class="kpi-grid">';
      agent.diagnostic_judgment.forEach(function(kpi) {
        html += '<div class="kpi">';
        html += '<div class="kpi-name">' + escapeHtml(kpi.name) + '</div>';
        html += '<div class="kpi-value" style="color: var(--muted); font-size: 0.95rem;">' + escapeHtml(kpi.current || 'needs review') + '</div>';
        html += '<div class="kpi-target">target: ' + escapeHtml(kpi.target || '—') + '</div>';
        if (kpi.note) html += '<div class="kpi-note">' + escapeHtml(kpi.note) + '</div>';
        html += '</div>';
      });
      html += '</div></section>';
    }

    // Recent sessions
    if (agent.recent_sessions && agent.recent_sessions.length) {
      html += '<section><h2>Recent sessions</h2>';
      agent.recent_sessions.slice(0, 10).forEach(function(s) {
        html += '<div class="session-row">';
        html += '<span class="session-date">' + escapeHtml(s.date || '—') + '</span>';
        html += '<span>' + escapeHtml(s.summary || '') + '</span>';
        html += '<span class="session-meta">' + (s.items_routed != null ? s.items_routed + ' routed' : '') +
                (s.items_corrected != null ? ' · ' + s.items_corrected + ' corrected' : '') + '</span>';
        html += '</div>';
      });
      html += '</section>';
    }

    // Workflows — the product catalog
    html += '<section><h2>Workflows</h2>';
    if (agent.workflows && agent.workflows.registered && agent.workflows.registered.length) {
      agent.workflows.registered.forEach(function(w) {
        var dotClass = w.status === 'active' ? 'active' : (w.status === 'designed_not_implemented' ? 'designed' : 'inactive');
        var cardClass = w.status === 'active' ? '' : 'inactive';
        var statusLabel = w.status === 'active' ? '' :
                         (w.status === 'designed_not_implemented' ? 'designed · v1.2' : escapeHtml(w.status));
        html += '<div class="workflow-card ' + cardClass + '">';
        html += '<span class="dot ' + dotClass + '"></span>';
        html += '<div>';
        html += '<div class="workflow-name">' + escapeHtml(w.name);
        if (w.category) html += '<span class="category-tag ' + escapeHtml(w.category) + '">' + escapeHtml(w.category.replace('_', ' ')) + '</span>';
        html += '</div>';
        html += '<div class="workflow-tagline">' + escapeHtml(w.tagline || '') + '</div>';
        html += '</div>';
        html += '<div class="workflow-meta">';
        if (w.primary_metric) {
          html += '<span class="metric-value">' + escapeHtml(String(w.primary_metric.value)) + '</span>';
          html += escapeHtml(w.primary_metric.name);
          if (w.primary_metric.trend) html += ' · ' + escapeHtml(w.primary_metric.trend);
        } else {
          html += statusLabel;
        }
        html += '</div>';
        html += '</div>';
      });
    } else {
      html += '<div class="placeholder"><b>No workflows registered yet.</b></div>';
    }
    html += '</section>';

  });

  html += '<footer>Virgil dashboard v0 · <a href="https://github.com/Tij8i/virgil">github.com/Tij8i/virgil</a></footer>';

  document.getElementById('app').innerHTML = html;
}

// Render now — both data scripts have already attempted to load by this point
render();
</script>
</body>
</html>
